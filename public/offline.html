<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline | FreshPoint</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #F6F2E8; color: #1b1330; text-align: center; padding: 24px; }
    main { max-width: 340px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.25rem; margin: 20px 0 8px; }
    p { margin: 0 0 20px; color: #5b5470; line-height: 1.5; font-size: .95rem; }
    button { background: #4B2E83; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="FreshPoint" />
    <h1>You're offline</h1>
    <p>FreshPoint needs an internet connection to show bookings and shops. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
